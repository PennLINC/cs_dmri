[package]
name = "cs_dmri_py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Python bindings for cs_dmri (built with maturin; not published as a Rust crate)"
publish = false

[lib]
name = "_cs_dmri"
crate-type = ["cdylib"]

[dependencies]
# No mimalloc: the allocator is the host interpreter's business.
cs_dmri = { path = "..", default-features = false }
odx-rs = { git = "https://github.com/PennLINC/odx-rs", tag = "v0.3.0" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
serde = "1"
anyhow = "1"
serde_json = "1"
