name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a new commit is pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-tests:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Build only the cs_dmri crate here. cs_dmri_py is a Python cdylib
      # whose link step needs `-undefined dynamic_lookup` on macOS
      # (configured in python/.cargo/config.toml, only visible when cargo
      # runs from python/). The cdylib itself is built in the python-tests
      # job via maturin; `cargo check` here still catches Rust errors.
      - name: cargo build (cs_dmri)
        run: cargo build -p cs_dmri --all-targets

      - name: cargo check (cs_dmri_py)
        run: cargo check -p cs_dmri_py

      - name: cargo test (cs_dmri)
        run: cargo test -p cs_dmri

  python-tests:
    name: Python tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # `maturin develop` requires an active virtualenv (it refuses to
      # install into the system Python). Create one inside python/ and
      # activate it for the remainder of the job by exporting VIRTUAL_ENV
      # and prepending its bin/ directory to PATH.
      - name: Create + activate virtualenv
        working-directory: python
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install build + test deps
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest numpy nibabel dipy

      - name: Build + install (maturin develop)
        working-directory: python
        run: maturin develop --release

      # tests/test_cli_parity.py skips here: it needs the qsiprep test data.
      - name: Run Python tests
        working-directory: python
        run: pytest tests/ -v
